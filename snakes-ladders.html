<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snakes and Ladders</title>
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/snakes-ladders.css">
</head>
<body>
<main class="app">
  <!-- SETUP ("New game") -->
  <section id="setup" class="app" aria-label="New game">
    <div class="top">
      <a class="homebtn" href="index.html" aria-label="All games">🏠</a>
      <h1>Snakes and Ladders</h1>
    </div>

    <div class="panel">
      <h2>Who's playing?</h2>
      <div class="modes">
        <button type="button" class="mode" id="modeRobot" aria-pressed="true"><span class="pair" id="pairRobot"></span>Me and the robot</button>
        <button type="button" class="mode" id="modeTwo" aria-pressed="false"><span class="pair" id="pairTwo"></span>Two players</button>
      </div>
    </div>

    <div class="panel p1">
      <h2><span id="p1Title">Pick your face</span> <span class="chip" id="p1Chip"></span></h2>
      <div class="faces" id="p1Faces"></div>
    </div>

    <div class="panel p2" id="p2Panel">
      <h2>Player 2, pick a face <span class="chip" id="p2Chip"></span></h2>
      <div class="faces" id="p2Faces"></div>
    </div>

    <div class="panel">
      <h2>Who goes first?</h2>
      <div class="firsts">
        <button type="button" class="first" data-rule="alt" aria-pressed="true"><span class="ico">🔁</span>Take turns</button>
        <button type="button" class="first" data-rule="win" aria-pressed="false"><span class="ico">🏆</span>Winner goes first</button>
        <button type="button" class="first" data-rule="lose" aria-pressed="false"><span class="ico">🤗</span>Loser goes first</button>
      </div>
    </div>

    <div class="go">
      <button type="button" class="big" id="playBtn">Play!</button>
      <div class="why" id="why"></div>
    </div>
  </section>

  <!-- PLAY -->
  <section id="play" class="app" aria-label="Game" hidden>
    <div class="top snl-top">
      <a class="homebtn" href="index.html" aria-label="All games">🏠</a>
      <div class="turn" id="turn" aria-live="polite"></div>
      <button type="button" class="die" id="die" aria-label="Roll the die"></button>
    </div>
    <div class="snlboard" id="board" aria-label="Board, 1 to 36"></div>
    <div class="scoreboard" aria-label="Games won">
      <div class="side c1" id="side1"><span class="chip" id="s1Chip"></span><span><span class="n" id="s1">0</span><span class="who" id="s1Who"></span></span></div>
      <div class="ties">Games<br>won</div>
      <div class="side c2" id="side2"><span class="chip" id="s2Chip"></span><span><span class="n" id="s2">0</span><span class="who" id="s2Who"></span></span></div>
    </div>
    <div class="controls">
      <button type="button" class="pill primary" id="againBtn">Play again</button>
      <button type="button" class="pill" id="newBtn">New game</button>
    </div>
  </section>
</main>
<footer class="site-foot">© 2026 Donald Parker · Free software under the GPL-3.0 · <a href="https://github.com/donpark2000/Web-Games" target="_blank" rel="noopener">Source code</a></footer>
<script type="module" src="src/ui/snakes-ladders.js"></script>
</body>
</html>
