<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matching Cards</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#E4F1EE">
<meta name="apple-mobile-web-app-title" content="Let's Play!">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/matching.css">
</head>
<body>
<main class="app">
  <!-- SETUP ("New game") -->
  <section id="setup" class="app" aria-label="New game">
    <div class="top">
      <a class="homebtn" href="index.html" aria-label="All games">🏠</a>
      <h1>Matching Cards</h1>
    </div>

    <div class="panel">
      <h2>Who's playing?</h2>
      <div class="modes">
        <button type="button" class="mode" id="modeSolo" aria-pressed="false"><span class="pair" id="pairSolo"></span>Just me</button>
        <button type="button" class="mode" id="modeTwo" aria-pressed="true"><span class="pair" id="pairTwo"></span>Two players</button>
      </div>
    </div>

    <div class="panel p1">
      <h2><span id="p1Title">Player 1, pick a face</span> <span class="chip" id="p1Chip"></span></h2>
      <div class="faces" id="p1Faces"></div>
    </div>

    <div class="panel p2" id="p2Panel">
      <h2><span>Player 2, pick a face</span> <span class="chip" id="p2Chip"></span></h2>
      <div class="faces" id="p2Faces"></div>
    </div>

    <div class="panel">
      <h2>How many cards?</h2>
      <div class="sizes" id="sizes"></div>
      <p class="sizenote" id="sizeNote"></p>
    </div>

    <div class="panel" id="firstPanel">
      <h2>Who goes first?</h2>
      <div class="firsts">
        <button type="button" class="first" data-rule="alt" aria-pressed="true"><span class="ico">🔁</span>Take turns</button>
        <button type="button" class="first" data-rule="win" aria-pressed="false"><span class="ico">🏆</span>Winner goes first</button>
        <button type="button" class="first" data-rule="lose" aria-pressed="false"><span class="ico">🤗</span>Loser goes first</button>
      </div>
    </div>

    <div class="go">
      <button type="button" class="big" id="playBtn">Play!</button>
      <div class="why" id="why"></div>
    </div>
  </section>

  <!-- PLAY -->
  <section id="play" class="app" aria-label="Game" hidden>
    <div class="top">
      <a class="homebtn" href="index.html" aria-label="All games">🏠</a>
      <div class="turn" id="turn" aria-live="polite"></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="sc" id="sc" aria-label="This game">
      <div class="side c1" id="side1"><span class="chip" id="s1Chip"></span><span><span class="n" id="s1">0</span><span class="who" id="s1Who">pairs</span></span></div>
      <div class="mid" id="mid">This<br>game</div>
      <div class="side c2" id="side2"><span class="chip" id="s2Chip"></span><span><span class="n" id="s2">0</span><span class="who" id="s2Who">pairs</span></span></div>
    </div>
    <div class="sc2" id="sc2" aria-label="Games won"></div>
    <div class="controls">
      <button type="button" class="pill primary" id="againBtn">Play again</button>
      <button type="button" class="pill" id="newBtn">New game</button>
    </div>
  </section>
</main>
<footer class="site-foot">© 2026 Donald Parker · Free software under the GPL-3.0 · <a href="https://github.com/donpark2000/Web-Games" target="_blank" rel="noopener">Source code</a> · <a href="https://donpark2000.goatcounter.com/" target="_blank" rel="noopener">Stats</a></footer>
<script type="module" src="src/ui/matching.js"></script>
<script type="module" src="src/ui/stats.js"></script>
<script type="module" src="src/ui/offline.js"></script>
</body>
</html>
