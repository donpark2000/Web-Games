<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Games</title>
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<main class="home">
  <h1>Let's play!</h1>
  <!-- Grouped by who can play (developer, 2026-10-04): a game with a
       two-player choice (a person or the robot as player 2) is a two-player
       game; one with no way to play another person is a one-player game. -->
  <section class="group" id="twoGroup" aria-labelledby="twoTitle">
    <h2 id="twoTitle"><span aria-hidden="true">👥</span> Two players</h2>
    <div class="games">
      <a class="game" id="tttLink" href="tic-tac-toe.html">
        <span class="pic" id="tttPic" aria-hidden="true"></span>
        Tic-Tac-Toe
      </a>
      <a class="game" id="cardsLink" href="matching.html">
        <span class="pic" id="cardsPic" aria-hidden="true"></span>
        Matching Cards
      </a>
      <a class="game" id="c4Link" href="connect-four.html">
        <span class="pic c4" id="c4Pic" aria-hidden="true"></span>
        Connect Four
      </a>
      <a class="game" id="countLink" href="count-to-9.html">
        <span class="pic" id="countPic" aria-hidden="true"></span>
        Count to 9
      </a>
      <a class="game" id="snlLink" href="snakes-ladders.html">
        <span class="pic snl" id="snlPic" aria-hidden="true"></span>
        Snakes and Ladders
      </a>
      <a class="game" id="diceLink" href="five-dice.html">
        <span class="pic" id="dicePic" aria-hidden="true"></span>
        Five Dice
      </a>
      <a class="game" id="nimLink" href="nim.html">
        <span class="pic nim" id="nimPic" aria-hidden="true"></span>
        Nim
      </a>
    </div>
  </section>
  <section class="group" id="oneGroup" aria-labelledby="oneTitle">
    <h2 id="oneTitle"><span aria-hidden="true">👤</span> One player</h2>
    <div class="games">
      <a class="game" id="rpsLink" href="rock-paper-scissors.html">
        <span class="pic rps" id="rpsPic" aria-hidden="true"></span>
        Rock Paper Scissors
      </a>
      <a class="game" id="fmLink" href="follow-me.html">
        <span class="pic fm" id="fmPic" aria-hidden="true"></span>
        Follow Me
      </a>
    </div>
  </section>
</main>
<footer class="site-foot">© 2026 Donald Parker · Free software under the GPL-3.0 · <a href="https://github.com/donpark2000/Web-Games" target="_blank" rel="noopener">Source code</a> · <a href="https://donpark-games.goatcounter.com/" target="_blank" rel="noopener">Stats</a></footer>
<script type="module">
  import { svg } from './src/ui/faces.js';
  import { CARD_BACK } from './src/ui/cardback.js';
  import { numberSvg } from './src/ui/numbercard.js';
  import { PICTURES } from './src/ui/rpspics.js';
  import { ladderSvg, snakeSvg, dotsSvg } from './src/ui/snlart.js';
  import { MATCH_SVG } from './src/ui/matchstick.js';
  import { padsFor } from './src/core/follow-me.js';
  import { padStyle } from './src/ui/fmpads.js';
  import { log, startLog } from './src/ui/debuglog.js';

  // A little finished game as the button's picture: the bear won the diagonal.
  const board = ['bear', 'robot', '', '', 'bear', 'robot', '', '', 'bear'];
  document.getElementById('tttPic').innerHTML = board.map(f =>
    `<span class="${f === 'bear' ? 'o1' : f ? 'o2' : ''}">${f ? svg(f, f === 'bear' ? 'winner' : 'normal') : ''}</span>`).join('');
  // Matching cards: a pair of frogs found among face-down cards.
  const cards = ['', 'frog', '', '', '', 'frog'];
  document.getElementById('cardsPic').innerHTML = cards.map(f =>
    f ? `<span class="o1">${svg(f)}</span>` : `<span class="cb">${CARD_BACK}</span>`).join('');
  // Connect Four: a small board (5 by 4) where the bear won a diagonal.
  const c4 = [
    '...b.',
    '..br.',
    '.brr.',
    'brrb.',
  ].join('');
  const c4Win = [3, 7, 11, 15];
  document.getElementById('c4Pic').innerHTML = [...c4].map((ch, i) => ch === '.' ? '<span></span>'
    : `<span class="${ch === 'b' ? 'o1' : 'o2'}">${svg(ch === 'b' ? 'bear' : 'robot', c4Win.includes(i) ? 'winner' : 'normal')}</span>`).join('');
  // Count to 9: 1, 2 and 3 found among face-down cards.
  const nums = [0, 2, 0, 1, 0, 0, 0, 0, 3];
  document.getElementById('countPic').innerHTML = nums.map(n =>
    n ? `<span class="o1 num">${numberSvg(n)}</span>` : `<span class="cb">${CARD_BACK}</span>`).join('');
  // Rock paper scissors: the bear's rock against the robot's scissors.
  document.getElementById('rpsPic').innerHTML = `<span>${svg('bear', 'winner')}</span><span class="vs">vs</span><span>${svg('robot', 'sad')}</span>`
    + `<span class="o1">${PICTURES.rock}</span><span class="vs"></span><span class="o2">${PICTURES.scissors}</span>`;
  // Snakes and Ladders: the bottom left corner of a board (4 by 4 squares),
  // the bear at the top of a ladder, the robot at its foot.
  let sq = '';
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
    sq += `<rect x="${c * 100}" y="${(5 - r) * 100}" width="100" height="100" fill="${(r + c) % 2 ? '#FFF4D6' : '#FFFFFF'}"/>`;
  }
  document.getElementById('snlPic').innerHTML = `<svg class="snlmini" viewBox="0 200 400 400">${sq}${snakeSvg(15, 4)}${ladderSvg(2, 14)}</svg>`
    + `<span class="tok o1" style="left: 37.5%; top: 37.5%">${svg('bear', 'winner')}</span>`
    + `<span class="tok o2" style="left: 37.5%; top: 86%">${svg('robot')}</span>`;
  // Five Dice: a full house, and the bear who rolled it.
  document.getElementById('dicePic').innerHTML = [5, 5, 5, 2, 2].map(n => `<span class="die">${dotsSvg(n)}</span>`).join('')
    + `<span class="o1">${svg('bear', 'winner')}</span>`;
  // Nim: the three rows on the wooden tray, two matches picked up (in the
  // bear's colour) from the last row.
  document.getElementById('nimPic').innerHTML = [3, 5, 7].map((n, r) => '<span class="nrow">'
    + Array.from({ length: n }, (_, i) => `<span class="${r === 2 && i >= 5 ? 'o1' : ''}">${MATCH_SVG}</span>`).join('') + '</span>').join('');
  // Follow Me: the four pads, the frog lit up.
  document.getElementById('fmPic').innerHTML = padsFor(4, 'bear').map((p, i) =>
    `<span class="${i === 0 ? 'lit' : ''}" style="${padStyle(p.color)}">${svg(p.face, i === 0 ? 'winner' : 'normal')}</span>`).join('');
  startLog('home');
  for (const g of document.querySelectorAll('.group')) {
    log.add('home', 'group', { group: g.id, games: [...g.querySelectorAll('.game')].map(a => a.getAttribute('href').replace(/[?#].*$/, '')) });
  }
</script>
<script type="module" src="src/ui/stats.js"></script>
</body>
</html>
