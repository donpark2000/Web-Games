<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Five Dice</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#E4F1EE">
<meta name="apple-mobile-web-app-title" content="Let's Play!">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/five-dice.css">
</head>
<body>
<main class="app">
  <!-- SETUP ("New game") -->
  <section id="setup" class="app" aria-label="New game">
    <div class="top">
      <a class="homebtn" href="index.html" aria-label="All games">🏠</a>
      <h1>Five Dice</h1>
    </div>

    <div class="panel">
      <h2>Who's playing?</h2>
      <div class="modes three">
        <button type="button" class="mode" data-mode="solo" aria-pressed="false"><span class="pair" id="pairSolo"></span>Just me</button>
        <button type="button" class="mode" data-mode="robot" aria-pressed="true"><span class="pair" id="pairRobot"></span>Me and the robot</button>
        <button type="button" class="mode" data-mode="two" aria-pressed="false"><span class="pair" id="pairTwo"></span>Two players</button>
      </div>
    </div>

    <div class="panel p1">
      <h2><span id="p1Title">Pick your face</span> <span class="chip" id="p1Chip"></span></h2>
      <div class="faces" id="p1Faces"></div>
    </div>

    <div class="panel p2" id="p2Panel">
      <h2>Player 2, pick a face <span class="chip" id="p2Chip"></span></h2>
      <div class="faces" id="p2Faces"></div>
    </div>

    <div class="panel">
      <h2>How long?</h2>
      <div class="levels">
        <button type="button" class="level" data-length="short" aria-pressed="true"><span class="ico">🎲</span>Short<small>7 boxes</small></button>
        <button type="button" class="level" data-length="long" aria-pressed="false"><span class="ico">🎲🎲🎲</span>Long<small>13 boxes</small></button>
      </div>
    </div>

    <div class="go">
      <button type="button" class="big" id="playBtn">Play!</button>
      <div class="why" id="why"></div>
    </div>
  </section>

  <!-- PLAY -->
  <section id="play" class="app" aria-label="Game" hidden>
    <div class="top">
      <a class="homebtn" href="index.html" aria-label="All games">🏠</a>
      <div class="turn" id="turn" aria-live="polite"></div>
    </div>
    <div class="tray" id="tray"></div>
    <div class="sheet" id="sheet"></div>
    <div class="tip" id="tip" role="dialog" aria-live="polite" hidden></div>
    <div class="scoreboard" id="scoreboard" aria-label="Score">
      <div class="side c1" id="side1"><span class="chip" id="s1Chip"></span><span><span class="n" id="s1">0</span><span class="who" id="s1Who"></span></span></div>
      <div class="mid" id="mid">Points</div>
      <div class="side c2" id="side2"><span class="chip" id="s2Chip"></span><span><span class="n" id="s2">0</span><span class="who" id="s2Who"></span></span></div>
    </div>
    <div class="controls">
      <button type="button" class="pill primary" id="againBtn">Play again</button>
      <button type="button" class="pill" id="newBtn">New game</button>
    </div>
  </section>
</main>
<footer class="site-foot">© 2026 Donald Parker · Free software under the GPL-3.0 · <a href="https://github.com/donpark2000/Web-Games" target="_blank" rel="noopener">Source code</a> · <a href="https://donpark2000.goatcounter.com/" target="_blank" rel="noopener">Stats</a></footer>
<script type="module" src="src/ui/five-dice.js"></script>
<script type="module" src="src/ui/stats.js"></script>
<script type="module" src="src/ui/offline.js"></script>
</body>
</html>
