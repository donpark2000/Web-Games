<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Web Games log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#E4F1EE">
<meta name="apple-mobile-web-app-title" content="Let's Play!">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/log.css">
</head>
<body>
<!-- The debug log kept on this device (DESIGN.md "Structure"). Nothing
     links here: the developer opens it by its address (2026-10-07). -->
<main class="app">
  <div class="top">
    <a class="homebtn" href="index.html" aria-label="All games">🏠</a>
    <h1>Log</h1>
  </div>
  <p class="about" id="about"></p>
  <div class="logbtns">
    <button type="button" class="pill primary" id="saveBtn">Save log</button>
    <button type="button" class="pill" id="copyBtn">Copy</button>
    <button type="button" class="pill" id="clearBtn">Clear</button>
  </div>
  <p class="said" id="said" aria-live="polite"></p>
  <pre class="lines" id="lines" tabindex="0" aria-label="Log lines"></pre>
</main>

<script type="module" src="src/ui/logpage.js"></script>
<script type="module" src="src/ui/offline.js"></script>
</body>
</html>
